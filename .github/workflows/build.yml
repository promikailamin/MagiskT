name: Magisk Complete Build

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions: write-all

jobs:
  # Job 1: Build both Release and Debug in parallel matrix
  build:
    name: Build (${{ matrix.build_type }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]
        include:
          - build_type: release
            flag: "-vr"
          - build_type: debug
            flag: "-v"

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          
      - name: Remove untrusted Homebrew tap warnings
        run: brew untap aws/tap || true

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup
        with:
          is-asset-build: true
          cache-key-prefix: ${{ matrix.build_type }}

      - name: Chmod build.py
        run: chmod +x build.py

      - name: Complete ${{ matrix.build_type }} build
        run: ./build.py ${{ matrix.flag }} all

      - name: Stop gradle daemon
        run: ./app/gradlew --stop

      - name: Stop sccache server
        if: always()
        run: sccache --stop-server || true

      # Caches are restored by the setup action and saved here at job end so
      # freshly-generated data is captured even when the build fails (always()).
      - name: Save sccache cache
        if: always() && steps.setup.outputs.sccache-cache-hit != 'true' && steps.setup.outputs.sccache-cache-key != ''
        uses: actions/cache/save@v5
        with:
          path: .sccache
          key: ${{ steps.setup.outputs.sccache-cache-key }}

      - name: Save Gradle dependency cache
        if: always() && steps.setup.outputs.gradle-cache-hit != 'true' && steps.setup.outputs.gradle-cache-key != ''
        uses: actions/cache/save@v5
        with:
          path: |
            .gradle/caches
            .gradle/wrapper
            !.gradle/caches/build-cache-*
          key: ${{ steps.setup.outputs.gradle-cache-key }}

      - name: Save Gradle build cache
        if: always() && steps.setup.outputs.gradle-build-cache-hit != 'true' && steps.setup.outputs.gradle-build-cache-key != ''
        uses: actions/cache/save@v5
        with:
          path: .gradle/caches/build-cache-*
          key: ${{ steps.setup.outputs.gradle-build-cache-key }}

      - name: Save ONDK cache
        if: always() && steps.setup.outputs.ondk-cache-hit != 'true' && steps.setup.outputs.ondk-cache-key != ''
        uses: actions/cache/save@v5
        with:
          path: ${{ env.NDK_CACHE_PATH }}
          key: ${{ steps.setup.outputs.ondk-cache-key }}

      - name: Prune stale caches
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_CACHES: "3"
        run: python3 .github/scripts/prune-caches.py

      - name: Upload native output staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: raw-native-${{ matrix.build_type }}
          path: native/out/
          compression-level: 0

      - name: Upload build output staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: raw-build-${{ matrix.build_type }}
          path: out/
          compression-level: 0

  # Job 2a: Release Artifact Node (Runs after Matrix Release build)
  upload-release-artifacts:
    name: Upload Release Artifacts
    needs: build
    runs-on: macos-26
    steps:
      - name: Download raw release output
        uses: actions/download-artifact@v7
        with:
          name: raw-build-release
          path: out

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: out/app-release.apk
          compression-level: 9

  # Job 2b: Debug Artifact Node (Runs after Matrix Debug build)
  upload-debug-artifacts:
    name: Upload Debug Artifacts
    needs: build
    runs-on: macos-26
    steps:
      - name: Download raw debug output
        uses: actions/download-artifact@v7
        with:
          name: raw-build-debug
          path: out

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: out/app-debug.apk
          compression-level: 9

  # Job 3: Final Node — Connects from both Release and Debug upload jobs
  create-release:
    name: Create GitHub Release
    needs: [upload-release-artifacts, upload-debug-artifacts]
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Download release APKs
        uses: actions/download-artifact@v7
        with:
          name: app-release
          path: out

      - name: Download debug APKs
        uses: actions/download-artifact@v7
        with:
          name: app-debug
          path: out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          api="repos/${GITHUB_REPOSITORY}"
          apk="out/app-release.apk"
          apkD="out/app-debug.apk"

          branch="${GITHUB_REF_NAME}"
          if [ "$branch" = "test" ]; then
              tag="test"
              channel="test"
              latest="false"
          else
              tag="build"
              channel="main"
              latest="true"
          fi
          commit=$(git rev-parse --short=8 HEAD)
          build_time=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          title="MagiskT ${channel} build (${commit})"
          body=$(printf "Channel: %s\nBranch: %s\nCommit: %s\nBuild time: %s\n" \
              "$channel" "$branch" "$commit" "$build_time")

          retry() {
              max=$1
              shift
              attempt=1
              until "$@"; do
                  if [ "$attempt" -ge "$max" ]; then
                      return 1
                  fi
                  echo "Command failed (attempt ${attempt}/${max}); retrying in $((attempt * 5))s..." >&2
                  sleep $((attempt * 5))
                  attempt=$((attempt + 1))
              done
          }

          find_release() {
              gh api "${api}/releases?per_page=100" \
                  --jq "[.[] | select(.tag_name == \"${tag}\")][0].id // empty"
          }

          assets=()
          if [ -f "$apk" ]; then
              echo "Release APK found."
              assets+=("$apk")
          fi
          if [ -f "$apkD" ]; then
              echo "Debug APK found."
              assets+=("$apkD")
          fi
          if [ ${#assets[@]} -eq 0 ]; then
              echo "No APK assets were produced." >&2
              exit 1
          fi

          # Point the rolling tag at the commit that produced these artifacts.
          if tag_sha=$(gh api "${api}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null); then
              if [ "$tag_sha" != "$GITHUB_SHA" ]; then
                  if ! retry 5 gh api -X PATCH "${api}/git/refs/tags/${tag}" \
                      -f sha="$GITHUB_SHA" -F force=true >/dev/null; then
                      echo "Warning: could not move tag '${tag}' to ${GITHUB_SHA}." >&2
                  fi
              fi
          else
              if ! retry 5 gh api -X POST "${api}/git/refs" \
                  -f ref="refs/tags/${tag}" -f sha="$GITHUB_SHA" >/dev/null; then
                  echo "Warning: could not create tag '${tag}'." >&2
              fi
          fi

          release_id=$(find_release)

          if [ -n "${release_id}" ]; then
              echo "Using existing release '${tag}' (${release_id})..."
              # Publish leftover drafts before uploading so assets attach to a
              # real tag. Metadata is refreshed after the uploads succeed.
              retry 5 gh api -X PATCH "${api}/releases/${release_id}" \
                  -F draft=false >/dev/null
          else
              echo "Creating release '${tag}'..."
              retry 5 gh release create "$tag" \
                  --verify-tag \
                  --title "$title" \
                  --notes "$body" \
                  --latest="$latest" >/dev/null
          fi

          # Upload assets separately. `gh release create` uploads through a
          # temporary draft, so a transient upload failure can leave the
          # release unpublished. Uploading after publishing avoids that, and
          # each asset gets its own retry.
          for asset in "${assets[@]}"; do
              echo "Uploading $(basename "$asset")..."
              retry 5 gh release upload "$tag" "$asset" --clobber
          done

          # Refresh metadata only after the new assets are in place and make
          # sure the release is published.
          release_id=$(find_release)
          retry 5 gh api -X PATCH "${api}/releases/${release_id}" \
              -f name="$title" \
              -f body="$body" \
              -f make_latest="$latest" \
              -F draft=false \
              -F prerelease=false >/dev/null

          echo "Published release '${tag}' for commit ${commit}."
