Name: Magisk Complete Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build (${{ matrix.build_type }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]
        include:
          - build_type: release
            flag: "-vr"
          - build_type: debug
            flag: "-v"

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Chmod build.py
        run: chmod +x build.py

      - name: Complete ${{ matrix.build_type }} build
        run: ./build.py ${{ matrix.flag }} all

      - name: Upload app ${{ matrix.build_type }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.build_type }}
          path: out/app-${{ matrix.build_type }}.apk
          compression-level: 9

      - name: Upload apkT ${{ matrix.build_type }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: apkT-${{ matrix.build_type }}
          path: out/apkT-${{ matrix.build_type }}.apk
          compression-level: 9

      - name: Stop gradle daemon
        run: ./app/gradlew --stop

      - name: Upload mapping and native debug symbols
        if: matrix.build_type == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-symbols
          path: app/apk/build/outputs
          compression-level: 9

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build"
          apk="out/app-release.apk"
          apkT="out/apkT-release.apk"
          apkD="out/app-debug.apk"
          apkTD="out/apkT-debug.apk"

          commit=$(git rev-parse --short HEAD)
          branch=${GITHUB_REF#refs/heads/}
          build_time=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          body=$(printf "# Branch: %s\n# Commit: %s\n# Build time: %s\n" \
          "$branch" \
          "$commit" \
          "$build_time")

          gh release delete "$tag" -y || true
          git tag -d "$tag" || true
          git push origin :refs/tags/$tag || true

          git tag "$tag"
          git push origin "$tag"

          assets=()

          if [ -f "$apk" ]; then
              echo "Release APK found."
              assets+=("$apk")
              assets+=("$apkD")
          fi

          if [ -f "$apkT" ]; then
              echo "Release T-APK found."
              assets+=("$apkT")
              assets+=("$apkTD")
          fi

          gh release create "$tag" "${assets[@]}" \
              --title "MagiskT Complete Build" \
              --notes "$body"
