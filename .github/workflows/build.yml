name: Magisk Complete Build

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions: write-all

jobs:
  # Job 1: Build both Release and Debug in parallel matrix
  build:
    name: Build (${{ matrix.build_type }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]
        include:
          - build_type: release
            flag: "-vrt"
          - build_type: debug
            flag: "-vt"

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          
      - name: Remove untrusted Homebrew tap warnings
        run: brew untap aws/tap || true

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true
          cache-key-prefix: ${{ matrix.build_type }}

      - name: Chmod build.py
        run: chmod +x build.py

      - name: Complete ${{ matrix.build_type }} build
        run: ./build.py ${{ matrix.flag }} all

      - name: Stop gradle daemon
        run: ./app/gradlew --stop

      - name: Prune stale caches
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_CACHES: "3"
        run: python3 .github/scripts/prune-caches.py

      - name: Upload native output staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: raw-native-${{ matrix.build_type }}
          path: native/out/
          compression-level: 0

      - name: Upload build output staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: raw-build-${{ matrix.build_type }}
          path: out/
          compression-level: 0

  # Job 2a: Release Artifact Node (Runs after Matrix Release build)
  upload-release-artifacts:
    name: Upload Release Artifacts
    needs: build
    runs-on: macos-26
    steps:
      - name: Download raw release output
        uses: actions/download-artifact@v7
        with:
          name: raw-build-release
          path: out

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: out/app-release.apk
          compression-level: 9

      - name: Upload release T artifact
        uses: actions/upload-artifact@v7
        with:
          name: apkT-release
          path: out/apkT-release.apk
          compression-level: 9

  # Job 2b: Debug Artifact Node (Runs after Matrix Debug build)
  upload-debug-artifacts:
    name: Upload Debug Artifacts
    needs: build
    runs-on: macos-26
    steps:
      - name: Download raw debug output
        uses: actions/download-artifact@v7
        with:
          name: raw-build-debug
          path: out

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: out/app-debug.apk
          compression-level: 9

      - name: Upload debug T artifact
        uses: actions/upload-artifact@v7
        with:
          name: apkT-debug
          path: out/apkT-debug.apk
          compression-level: 9

  # Job 3: Final Node — Connects from both Release and Debug upload jobs
  create-release:
    name: Create GitHub Release
    needs: [upload-release-artifacts, upload-debug-artifacts]
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Download release APKs
        uses: actions/download-artifact@v7
        with:
          name: app-release
          path: out

      - name: Download release T APKs
        uses: actions/download-artifact@v7
        with:
          name: apkT-release
          path: out

      - name: Download debug APKs
        uses: actions/download-artifact@v7
        with:
          name: app-debug
          path: out

      - name: Download debug T APKs
        uses: actions/download-artifact@v7
        with:
          name: apkT-debug
          path: out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build"
          apk="out/app-release.apk"
          apkT="out/apkT-release.apk"
          apkD="out/app-debug.apk"
          apkTD="out/apkT-debug.apk"

          commit=$(git rev-parse --short HEAD)
          branch=${GITHUB_REF#refs/heads/}
          build_time=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          body=$(printf "# Branch: %s\n# Commit: %s\n# Build time: %s\n" \
          "$branch" \
          "$commit" \
          "$build_time")

          gh release delete "$tag" -y --cleanup-tag || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" || true

          assets=()

          if [ -f "$apk" ]; then
              echo "Release APK found."
              assets+=("$apk")
              assets+=("$apkD")
          fi

          if [ -f "$apkT" ]; then
              echo "Release T-APK found."
              assets+=("$apkT")
              assets+=("$apkTD")
          fi

          gh release create "$tag" "${assets[@]}" \
              --title "MagiskT Complete Build" \
              --notes "$body"
