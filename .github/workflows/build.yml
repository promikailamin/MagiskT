name: Magisk Complete Build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "native/**"
      - "build.py"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Magisk artifacts
    runs-on: macos-26

    permissions: write-all
    strategy:
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Chmod build.py
        run: chmod +x build.py

      - name: Complete release build
        run: ./build.py -vr all

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}
          path: out/app-release.apk
          compression-level: 9
          
      - name: Upload release T artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}
          path: out/apkT-release.apk
          compression-level: 9

      - name: Complete debug build
        run: ./build.py -v all

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}
          path: out/app-debug.apk
          compression-level: 9
          
      - name: Upload debug T artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}
          path: out/apkT-debug.apk
          compression-level: 9

      - name: Stop gradle daemon
        run: ./app/gradlew --stop

      - name: Upload mapping and native debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-symbols
          path: app/apk/build/outputs
          compression-level: 9
          
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build"
          apk="out/app-release.apk"
          apkT="out/apkT-release.apk"

          commit=$(git rev-parse --short HEAD)
          branch=${GITHUB_REF#refs/heads/}
          build_time=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          body=$(printf "# Branch: %s\n# Commit: %s\n# Build time: %s\n" \
              "$branch" \
              "$commit" \
              "$build_time" \

          gh release delete "$tag" -y || true
          git tag -d "$tag" || true
          git push origin :refs/tags/$tag || true

          git tag "$tag"
          git push origin "$tag"

          if [ -f "$app" ]; then
              echo "app was found and add to release."
              assets+=("$app")
          else
              echo "app isn't exist. Skipping."
          fi

          if [ -f "$apkT" ]; then
              echo "apkT was found and add to release."
              assets+=("$apkT")
          else
              echo "apkT isn't exist. Skipping."
          fi

          gh release create "$tag" "${assets[@]}" \
              --title "MagiskT Complete Build;" \
              --notes "$body"